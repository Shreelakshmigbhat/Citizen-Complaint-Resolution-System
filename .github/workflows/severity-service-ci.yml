name: Severity Service CI

on:
  push:
    branches: [master, develop, 'feature/**']
    paths:
      - 'backend/severity-service/**'
      - '.github/workflows/severity-service-ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'backend/severity-service/**'
      - 'backend/pgr-services/src/**/SeverityClient*.java'
      - '.github/workflows/severity-service-ci.yml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/severity-service/requirements-dev.txt
      - name: Install CPU torch + dependencies
        working-directory: backend/severity-service
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend/severity-service
        run: python -m pytest tests -q

  docker:
    name: Image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t severity-service:ci backend/severity-service
      - name: Run and check /health, /severity
        run: |
          docker run -d --name sev -p 8000:8000 severity-service:ci
          for i in $(seq 1 40); do
            curl -sf localhost:8000/health && break || sleep 3
          done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/severity -H 'Content-Type: application/json' \
            -d '{"description":"Stray dogs attacking children","complaint_type":"Street Dogs"}' | tee /dev/stderr | grep -q '"severity"'
      - name: Container logs on failure
        if: failure()
        run: docker logs sev
